server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    gzip_disable "MSIE [1-6]\.";

    # ========== SEO：爬虫/社交分享 UA 分流 ==========
    # 仅识别明确的搜索引擎与社交分享爬虫，不含 MicroMessenger（微信普通用户 UA）
    set $is_seo_bot 0;
    if ($http_user_agent ~* "(Baiduspider|Googlebot|bingbot|YandexBot|Sogou|360Spider|Bytespider|Twitterbot|facebookexternalhit|TelegramBot|WhatsApp)") {
        set $is_seo_bot 1;
    }

    # robots 与 sitemap 反代到 Go 后端（必须在 location / 之前）
    location = /robots.txt {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持：爬虫转发到命名 location @seo，普通用户走 SPA
    location / {
        if ($is_seo_bot = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    # 爬虫预渲染分流（error_page 418 触发，避免 if+proxy_pass 与 try_files 冲突）
    error_page 418 = @seo;
    location @seo {
        proxy_pass http://seo-renderer:3000/seo?path=$uri;
        proxy_set_header X-SEO-Token "photoset-seo-internal-2026";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors off;
    }

    # API 代理（通过宝塔/外部 nginx 代理，此处直接转发到后端）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}