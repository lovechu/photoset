      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20，最大100
        in: query
        name: page_size
        type: integer
      - description: 标签名称
        in: query
        name: tag
        type: string
      - description: 仅查看自己的作品
        in: query
        name: mine
        type: boolean
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 状态筛选(draft/published/pending)
        in: query
        name: status
        type: string
      - description: 分类slug
        in: query
        name: category
        type: string
      - description: 最低价格
        in: query
        name: price_min
        type: number
      - description: 最高价格
        in: query
        name: price_max
        type: number
      - description: 是否免费
        in: query
        name: is_free
        type: boolean
      - description: 排序方式
        in: query
        name: sort_by
        type: string
      - description: 时间范围
        in: query
        name: time_range
        type: string
      - description: 用户ID筛选
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
