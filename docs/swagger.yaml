            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权编辑
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 套图不存在
