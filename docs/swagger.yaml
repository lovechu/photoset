basePath: /api
definitions:
  domain.Category:
    properties:
      created_at:
        type: string
      description:
        description: 描述（可选）
        type: string
      id:
        type: integer
      name:
        description: 显示名称，如 "自然风光"
        type: string
      slug:
        description: URL标识，如 "nature"
        type: string
      sort_order:
        description: 排序权重，越大越前
        type: integer
      updated_at:
        type: string
    type: object
  domain.Photo:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      photoset:
        allOf:
        - $ref: '#/definitions/domain.PhotoSet'
        description: 关联
      photoset_id:
        type: integer
      sort_order:
        type: integer
      url:
        type: string
    type: object
  domain.PhotoSet:
    properties:
      category:
        description: 分类 slug，如 'nature'
        type: string
      cover:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_favorited:
        description: 非数据库字段（忽略数据库的 photo_count 列，手动计算）
        type: boolean
      is_free:
        type: integer
      photo_count:
        description: 图片数量（忽略数据库列）
        type: integer
      photos:
        items:
          $ref: '#/definitions/domain.Photo'
        type: array
      price:
        type: number
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/domain.Tag'
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: 关联
      user_id:
        type: integer
    type: object
  domain.Post:
    properties:
      author_ip_location:
        type: string
      category:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_essence:
        type: boolean
      is_pinned:
        type: boolean
      like_count:
        type: integer
      photoset:
        $ref: '#/definitions/domain.PhotoSet'
      photoset_id:
        description: nullable, optional association with photoset
        type: integer
      post_type:
        type: string
      replies:
        items:
          $ref: '#/definitions/domain.PostReply'
        type: array
      reply_count:
        type: integer
      share_count:
        type: integer
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/domain.Tag'
        type: array
      title:
        type: string
      topics:
        items:
          $ref: '#/definitions/domain.Topic'
        type: array
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Associations
      user_id:
        type: integer
      view_count:
        type: integer
      visibility:
        type: string
    type: object
  domain.PostReply:
    properties:
      author_ip_location:
        type: string
      children:
        items:
          $ref: '#/definitions/domain.PostReply'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      parent_reply_id:
        description: nil means direct reply to post
        type: integer
      post_id:
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Associations
      user_id:
        type: integer
    type: object
  domain.Tag:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      photosets:
        description: 关联
        items:
          $ref: '#/definitions/domain.PhotoSet'
        type: array
      posts:
        items:
          $ref: '#/definitions/domain.Post'
        type: array
    type: object
  domain.Topic:
    properties:
      cover:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_hot:
        type: boolean
      name:
        type: string
      post_count:
        type: integer
      posts:
        description: 关联
        items:
          $ref: '#/definitions/domain.Post'
        type: array
      status:
        type: string
    type: object
  domain.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      circle_count:
        type: integer
      created_at:
        type: string
      deletion_requested_at:
        description: 账号注销相关
        type: string
      email:
        type: string
      exp:
        type: integer
      follower_count:
        type: integer
      following_count:
        type: integer
      id:
        type: integer
      ip_location:
        type: string
      last_login_at:
        type: string
      level:
        type: integer
      like_count:
        type: integer
      membership_expires:
        description: 会员过期时间，nil 表示非会员
        type: string
      nickname:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        type: integer
      updated_at:
        type: string
    type: object
  domain.UserRole:
    enum:
    - guest
    - user
    - member
    - creator
    - vip
    - admin
    type: string
    x-enum-varnames:
    - RoleGuest
    - RoleUser
    - RoleMember
    - RoleCreator
    - RoleVIP
    - RoleAdmin
  handlers.CreateFeedbackRequest:
    properties:
      category:
        type: string
      contact:
        type: string
      content:
        maxLength: 2000
        minLength: 10
        type: string
      device_info:
        type: string
      images:
        items:
          type: string
        type: array
    required:
    - category
    - content
    type: object
  handlers.CreateOrderRequest:
    properties:
      membership_id:
        type: integer
      photoset_id:
        type: integer
      type:
        enum:
        - membership
        - single
        type: string
    required:
    - type
    type: object
  handlers.CreateRequest:
    properties:
      category:
        description: 分类 slug
        type: string
      cover:
        maxLength: 500
        type: string
      description:
        type: string
      is_free:
        enum:
        - 0
        - 1
        type: integer
      photos:
        items:
          $ref: '#/definitions/handlers.Photo'
        type: array
      price:
        type: number
      status:
        enum:
        - draft
        - published
        - pending
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - cover
    - title
    type: object
  handlers.PayRequest:
    properties:
      payment_method:
        enum:
        - alipay
        - mock
        type: string
    required:
    - payment_method
    type: object
  handlers.Photo:
    properties:
      sort_order:
        type: integer
      url:
        maxLength: 500
        type: string
    required:
    - url
    type: object
  handlers.RegisterRequest:
    properties:
      captcha_code:
        type: string
      captcha_id:
        type: string
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - captcha_code
    - captcha_id
    - email
    - nickname
    - password
    type: object
  handlers.RequestDeletionRequest:
    properties:
      password:
        type: string
      reason:
        type: string
    required:
    - password
    type: object
  handlers.UpdateRequest:
    properties:
      category:
        description: 分类 slug
        type: string
      cover:
        maxLength: 500
        type: string
      description:
        type: string
      is_free:
        enum:
        - 0
        - 1
        type: integer
      photos:
        items:
          $ref: '#/definitions/handlers.Photo'
        type: array
      price:
        type: number
      status:
        enum:
        - draft
        - published
        - pending
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - cover
    - title
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.SaveDraftRequest:
    properties:
      category:
        type: string
      content:
        type: string
      id:
        description: nil for create, non-nil for update
        type: integer
      post_type:
        type: string
      title:
        type: string
      visibility:
        type: string
    required:
    - content
    type: object
  service.UpdatePostRequest:
    properties:
      category:
        type: string
      content:
        type: string
      post_type:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      topics:
        items:
          type: string
        type: array
      visibility:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@photoset.example.com
    name: API Support
  description: |-
    PhotoSet 摄影套图浏览平台后端 API 文档
    提供套图管理、社区互动、用户认证、支付等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://photoset.example.com/terms
  title: PhotoSet API
  version: "1.0"
paths:
  /api/admin/categories:
    get:
      consumes:
      - application/json
      description: 管理员获取分类列表，支持分页和关键词搜索
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 管理分类列表
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: 管理员创建新分类
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
            slug:
              type: string
            sort_order:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.Category'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建分类
      tags:
      - Admin
  /api/admin/system/goroutines:
    get:
      consumes:
      - application/json
      description: 获取当前所有 Goroutine 的堆栈信息（调试用）
      produces:
      - application/json
      responses:
        "200":
          description: Goroutine 堆栈
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Goroutine 信息
      tags:
      - System
  /api/admin/system/profile/cpu:
    get:
      consumes:
      - application/json
      description: 开始 CPU 性能分析采样
      parameters:
      - default: 30
        description: 采样时长（秒）
        in: query
        name: duration
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Profile 文件
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 开始 CPU Profile
      tags:
      - System
  /api/admin/system/profile/heap:
    get:
      consumes:
      - application/json
      description: 获取当前堆内存分析快照（pprof 格式）
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 内存分析
      tags:
      - System
  /api/admin/tags/{id}:
    delete:
      consumes:
      - application/json
      description: 管理员删除标签
      parameters:
      - description: 标签ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 无效的标签ID
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除标签
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: 管理员更新标签名称
      parameters:
      - description: 标签ID
        in: path
        name: id
        required: true
        type: integer
      - description: 标签名称
        in: body
        name: request
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新标签
      tags:
      - Admin
  /api/auth/bind-email:
    put:
      consumes:
      - application/json
      description: 将邮箱绑定到当前登录用户，需要先通过VerifyEmailCode验证
      parameters:
      - description: 绑定邮箱请求参数，包含email和code
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 绑定成功，返回用户邮箱信息
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 参数错误或验证码错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务未初始化
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 绑定邮箱
      tags:
      - Auth
  /api/auth/cancel-deletion:
    post:
      consumes:
      - application/json
      description: 取消已提交的账号注销申请
      produces:
      - application/json
      responses:
        "200":
          description: 取消成功
          schema:
            type: object
        "400":
          description: 操作失败
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 取消注销申请
      tags:
      - Auth
  /api/auth/captcha:
    get:
      consumes:
      - application/json
      description: 生成登录/注册/找回密码用的图形验证码
      parameters:
      - default: login
        description: 场景(login/register/forgot)
        in: query
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 验证码ID和Base64图片
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 生成失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 生成图形验证码
      tags:
      - Auth
  /api/auth/deletion-status:
    get:
      consumes:
      - application/json
      description: 查询当前账号的注销申请状态
      produces:
      - application/json
      responses:
        "200":
          description: 注销状态
          schema:
            type: object
        "401":
          description: 未登录
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 查询注销状态
      tags:
      - Auth
  /api/auth/email-config:
    get:
      consumes:
      - application/json
      description: 检查SMTP邮件服务是否已配置可用
      produces:
      - application/json
      responses:
        "200":
          description: 邮件配置状态
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: 检查邮件配置
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账户，需要提供昵称、邮箱、密码和图形验证码
      parameters:
      - description: 注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 请求参数错误或验证码错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - Auth
  /api/auth/request-deletion:
    post:
      consumes:
      - application/json
      description: 提交账号注销申请，进入30天冷静期
      parameters:
      - description: 注销请求 {password, reason}
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RequestDeletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 申请成功
          schema:
            type: object
        "400":
          description: 参数错误
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: 申请注销账号
      tags:
      - Auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 使用邮件中的重置Token来设置新密码
      parameters:
      - description: 重置密码请求参数，包含token和new_password
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 密码重置成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误或Token无效
          schema:
            $ref: '#/definitions/response.Response'
      summary: 通过Token重置密码
      tags:
      - Auth
  /api/auth/verify-email-code:
    post:
      consumes:
      - application/json
      description: 验证发送到邮箱的验证码，确认邮箱所有权
      parameters:
      - description: 验证请求参数，包含email、code和purpose
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 验证成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误或验证码错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务未初始化
          schema:
            $ref: '#/definitions/response.Response'
      summary: 验证邮箱验证码
      tags:
      - Auth
  /api/collections:
    get:
      consumes:
      - application/json
      description: 获取当前用户的所有合集列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 合集列表
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取合集列表
      tags:
      - Collections
    post:
      consumes:
      - application/json
      description: 创建新的套图合集
      parameters:
      - description: 合集信息 {name, description, is_public}
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建合集
      tags:
      - Collections
  /api/collections/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的合集及其关联数据
      parameters:
      - description: 合集ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 无效的合集ID
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除合集
      tags:
      - Collections
    get:
      consumes:
      - application/json
      description: 获取指定合集的详细信息和包含的套图列表
      parameters:
      - description: 合集ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 合集详情
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 无效的合集ID
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取合集详情
      tags:
      - Collections
    put:
      consumes:
      - application/json
      description: 修改合集的名称、描述或可见性
      parameters:
      - description: 合集ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息 {name, description, is_public}
        in: body
        name: body
        required: true
        schema:
